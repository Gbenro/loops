name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy Migrations
        run: |
          supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
