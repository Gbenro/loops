,\r\n      'How can you express gratitude for what has unfolded?'\r\n    ]\r\n  },\r\n\r\n  'last-quarter': {\r\n    title: 'Last Quarter',\r\n    symbol: '🌗',\r\n    energy: 'Release',\r\n    phaseType: 'threshold',\r\n    guidance: 'Clear the path. Consciously close what no longer serves.',\r\n    deep: 'Half-lit again, but turning toward the dark. Forgive, release, and consciously clear what you will not carry forward.',\r\n    keywords: ['Release', 'Clearing', 'Forgiveness', 'Closure', 'Surrender'],\r\n    asks: 'What are you ready to let go of?',\r\n    loopAdvice: 'Consciously close open loops. Clear mental clutter.',\r\n    tides: {\r\n      opening: [\r\n        'The release is beginning. What did not complete wants to be let go now.',\r\n        'The last quarter opens. A clear-eyed letting go is being asked of you.'\r\n      ],\r\n      flowing: [\r\n        'You are inside the clearing. What you release here makes room for the new cycle.',\r\n        'This is not failure — it is completion. Surrender what is finished.'\r\n      ],\r\n      completing: [\r\n        'The clearing is nearly done. What you surrender becomes compost for the next beginning.',\r\n        'The last quarter completes its work. Release is an act of care.'\r\n      ],\r\n      closing: [\r\n        'The threshold closes. The waning crescent nears — bring the clearing to rest.',\r\n        'The release is behind you. Prepare to enter the sacred quiet.'\r\n      ]\r\n    },\r\n    questions: [\r\n      'What expectation or attachment are you ready to surrender?',\r\n      'Which loop or commitment can you consciously close today?',\r\n      'What forgiveness can you offer yourself or another before the cycle ends?'\r\n    ]\r\n  },\r\n\r\n  'waning-crescent': {\r\n    title: 'Waning Crescent',\r\n    symbol: '🌘',\r\n    energy: 'Rest',\r\n    phaseType: 'flow',\r\n    guidance: 'Rest deeply. Do not start anything new. Surrender to stillness.',\r\n    deep: 'The final sliver of light before the new moon. Recuperate, dream, and allow the mind to become fallow.',\r\n    keywords: ['Rest', 'Stillness', 'Surrender', 'Dreaming', 'Fallow'],\r\n    asks: 'How can you deeply rest today?',\r\n    loopAdvice: 'Do not open new loops. Rest and let the field go fallow.',\r\n    tides: {\r\n      opening: [\r\n        'The final phase opens. Let the cycle breathe down into stillness.',\r\n        'The waning crescent begins. Rest is the primary work now.'\r\n      ],\r\n      flowing: [\r\n        'You are in the fallow time. The cycle integrates everything it held. Rest with it.',\r\n        'The darkness is gathering softly. Trust the quiet.'\r\n      ],\r\n      completing: [\r\n        'The sliver is vanishing. What wants to drop away before the new moon?',\r\n        'The dark is very close. Be gentle with your thoughts and energy.'\r\n      ],\r\n      closing: [\r\n        'The crescent closes. The new moon is arriving. Arrive at it empty and open.',\r\n        'The old cycle is finished. Everything is at rest.'\r\n      ]\r\n    },\r\n    questions: [\r\n      'Where can you soften and surrender effort today?',\r\n      'What does your body need in order to feel completely restored?',\r\n      'Can you allow yourself to not know what comes next?'\r\n    ]\r\n  }\r\n};\r\n\r\nconst ZODIAC_LORE                                                                                                       = {\r\n  Aries: { element: 'Fire', modality: 'Cardinal', ruler: 'Mars', meaning: 'Spontaneous spark, courage, initiative', focus: 'Action and courageous beginnings' },\r\n  Taurus: { element: 'Earth', modality: 'Fixed', ruler: 'Venus', meaning: 'Sensory grounding, stability, physical presence', focus: 'Patience, the body, and simple pleasures' },\r\n  Gemini: { element: 'Air', modality: 'Mutable', ruler: 'Mercury', meaning: 'Curiosity, perception, mental agility', focus: 'Inquiry, conversation, and multiple angles' },\r\n  Cancer: { element: 'Water', modality: 'Ca tience and quiet reflection.', keywords: ['Patience', 'Stillness', 'Sanctuary', 'Waiting'] },\r\n  Worm: { name: 'Worm Moon', meaning: 'The ground begins to thaw. Microscopic life stirs in the dark soil before spring.', keywords: ['Awakening', 'Thaw', 'Emergence', 'Renewal'] },\r\n  Pink: { name: 'Pink Moon', meaning: 'Wild moss phlox blooms across meadows. Color returns after long dormancy.', keywords: ['Color', 'Blossoming', 'Beauty', 'Vitality'] },\r\n  Flower: { name: 'Flower Moon', meaning: 'Abundant blossoms and fertile warmth. The peak of natural creativity and scent.', keywords: ['Abundance', 'Fertility', 'Creativity', 'Celebration'] },\r\n  Strawberry: { name: 'Strawberry Moon', meaning: 'First sweet wild berries ripen for the gathering. Reward for gentle patience.', keywords: ['Sweetness', 'Harvest', 'Reward', 'Delight'] },\r\n  Buck: { name: 'Buck Moon', meaning: 'Young deer grow new velvet antlers. Rapid growth, nobility, and testing strength.', keywords: ['Regeneration', 'Strength', 'Growth', 'Sovereignty'] },\r\n  Sturgeon: { name: 'Sturgeon Moon', meaning: 'Ancient fish swim the deep waters. Reaching into old depths and enduring wisdom.', keywords: ['Ancient Memory', 'Depth', 'Resilience', 'Ancestry'] },\r\n  Harvest: { name: 'Harvest Moon', meaning: 'Bright golden light that lingers at dusk. Bringing in the primary harvest of the year.', keywords: ['Fulfillment', 'Abundance', 'Gratitude', 'Completion'] },\r\n  \"Hunter's\": { name: \"Hunter's Moon\", meaning: 'Leaves fall and fields are clear. Gathering winter stores and focusing vision.', keywords: ['Focus', 'Preparation', 'Discernment', 'Sanctuary'] },\r\n  Beaver: { name: 'Beaver Moon', meaning: 'Beavers prepare lodges for ice and cold. Building strong shelters and boundaries.', keywords: ['Shelter', 'Foundation', 'Readiness', 'Security'] },\r\n  Cold: { name: 'Cold Moon', meaning: 'The longest nights of the year. The sun reaches its lowest point before turning.', keywords: ['Solstice', 'Turning', 'Deep Rest', 'Mystery'] }\r\n};\r\n\r\n                              \r\n               \r\n                    \r\n                                   \r\n                                      \r\n                        \r\n                      \r\n                   \r\n \r\n\r\nfunction getSolarSeason(date       = new Date())              {\r\n  const startOfYear = new Date(date.getFullYear(), 0, 1);\r\n  const diff = date.getTime() - startOfYear.getTime();\r\n  const dayOfYear = Math.floor(diff / 86400000) + 1;\r\n\r\n  // Northern hemisphere calendar approximations\r\n  if (dayOfYear >= 80 && dayOfYear \u003c 172) {\r\n    const total = 172 - 80;\r\n    const elapsed = dayOfYear - 80;\r\n    return {\r\n      name: 'Spring',\r\n      dayOfYear,\r\n      seasonProgress: elapsed / total,\r\n      daysToNextSolsticeOrEquinox: 172 - dayOfYear,\r\n      nextEventName: 'Summer Solstice',\r\n      description: 'The world stirs. Sap rises. Creative force returns to the surface.',\r\n      guidance: 'Plant and water. What you start in spring has natural momentum behind it.'\r\n    };\r\n  } else if (dayOfYear >= 172 && dayOfYear \u003c 266) {\r\n    const total = 266 - 172;\r\n    const elapsed = dayOfYear - 172;\r\n    return {\r\n      name: 'Summer',\r\n      dayOfYear,\r\n      seasonProgress: elapsed / total,\r\n      daysToNextSolsticeOrEquinox: 266 - dayOfYear,\r\n      nextEventName: 'Autumn Equinox',\r\n      description: 'Full heat, full light, outward action. The peak of the outward arc.',\r\n      guidance: 'Act with warmth. Bring ideas into the full light of day.'\r\n    };\r\n  } else if (dayOfYear >= 266 && dayOfYear \u003c 355) {\r\n    const total = 355 - 266;\r\n    const elapsed = dayOfYear - 266;\r\n    return {\r\n      name: 'Autumn',\r\n      dayOfYear,\r\n      seasonProgress: elapsed / total,\r\n      daysToNextSolsticeOrEquinox: 355 - dayOfYear,\r\n      nextEventName: 'Winter Solstice',\r\n      description: 'Light retreats. The harvest is gathered. What was built is sorted.',\r\n      guidance: 'Harvest and clarify. Notice what was gained and what is ready to be released.'\r\n    };\r\n  } else {\r\n    // Winter\r\n    let elapsed = 0;\r\n    let total = 89;\r\n    if (dayOfYear >= 355) {\r\n      elapsed = dayOfYear - 355;\r\n    } else {\r\n      elapsed = (365 - 355) + dayOfYear;\r\n    }\r\n    const daysToSpring = dayOfYear \u003c 80 ? (80 - dayOfYear) : (365 - dayOfYear + 80);\r\n    return {\r\n      name: 'Winter',\r\n      dayOfYear,\r\n      seasonProgress: Math.min(1, elapsed / total),\r\n      daysToNextSolsticeOrEquinox: daysToSpring,\r\n      nextEventName: 'Spring Equinox',\r\n      description: 'The land rests. Energy draws inward. Internal tending shapes the next year.',\r\n      guidance: 'Rest without apology. The roots grow strongest in the quiet cold.'\r\n    };\r\n  }\r\n}\r\n\r\nfunction getWeaveSynthesis(phaseId        , date       = new Date())         {\r\n  const season = getSolarSeason(date);\r\n  const phase = PHASE_WISDOM[phaseId] || PHASE_WISDOM.new;\r\n\r\n  const pairKey = `${phaseId}-${season.name.toLowerCase()}`;\r\n  const weaves                         = {\r\n    'first-quarter-autumn': 'A decision in the season of harvest. What you commit to now determines what you store for winter.',\r\n    'first-quarter-winter': 'Clarity in the cold quiet. A decision that asks for internal conviction, not external praise.',\r\n    'first-quarter-spring': 'A decisive turn as the green rises. Committing outward to what you planted in the dark.',\r\n    'first-quarter-summer': 'Bold action under open skies. The momentum is here — choose your path with courage.',\r\n    'full-autumn': 'The full harvest illuminated. Look with clear eyes at what this year has yielded.',\r\n    'new-autumn': 'A quiet seed planted in the turning leaves. Rest before the gathering begins.',\r\n    'last-quarter-autumn': 'A deep letting go as the trees release their foliage. Free yourself from what is done.'\r\n  };\r\n\r\n  return weaves[pairKey] || `${phase.title} in ${season.name}. ${phase.energy} energy meeting the ${season.description.toLowerCase()}`;\r\n}\r\n\n\n// lunar-engine.ts\n                                                                          \r\n\r\n// Canonical Astronomical Constants (Jean Meeus Moon Ephemeris)\r\nconst SYNODIC = 29.53058867; // Average synodic month in days\r\nconst KNOWN_NEW_MOON = 2451550.259; // Jan 6 2000 18:14 UTC\r\n\r\nconst PHASE_DURATION = {\r\n  threshold: 1.85, // days (±0.925 days around cardinal peaks)\r\n  flow: 5.55,      // days\r\n};\r\nconst HALF_THRESHOLD = PHASE_DURATION.threshold / 2; // 0.925 days\r\nconst FULL_MOON_PEAK = SYNODIC / 2; // ~14.7653 days\r\n\r\nconst LUNAR_PHASE_DEFS                                                                                                = [\r\n  { id: 'new', name: 'New Moon', shortName: 'New', index: 0, start: 0, end: HALF_THRESHOLD },\r\n  { id: 'waxing-crescent', name: 'Waxing Crescent', shortName: 'Waxing crescent', index: 1, start: HALF_THRESHOLD, end: (SYNODIC / 4) - HALF_THRESHOLD },\r\n  { id: 'first-quarter', name: 'First Quarter', shortName: 'First quarter', index: 2, start: (SYNODIC / 4) - HALF_THRESHOLD, end: (SYNODIC / 4) + HALF_THRESHOLD },\r\n  { id: 'waxing-gibbous', name: 'Waxing Gibbous', shortName: 'Waxing gibbous', index: 3, start: (SYNODIC / 4) + HALF_THRESHOLD, end: FULL_MOON_PEAK - HALF_THRESHOLD },\r\n  { id: 'full', name: 'Full Moon', shortName: 'Full', index: 4, start: FULL_MOON_PEAK - HALF_THRESHOLD, end: FULL_MOON_PEAK + HALF_THRESHOLD },\r\n  { id: 'waning-gibbous', name: 'Waning Gibbous', shortName: 'Waning gibbous', index: 5, start: FULL_MOON_PEAK + HALF_THRESHOLD, end: (3 * SYNODIC / 4) - HALF_THRESHOLD },\r\n  { id: 'last-quarter', name: 'Last Quarter', shortName: 'Last quarter', index: 6, start: (3 * SYNODIC / 4) - HALF_THRESHOLD, end: (3 * SYNODIC / 4) + HALF_THRESHOLD },\r\n  { id: 'waning-crescent', name: 'Waning Crescent', shortName: 'Waning crescent', index: 7, start: (3 * SYNODIC / 4) + HALF_THRESHOLD, end: SYNODIC - HALF_THRESHOLD },\r\n];\r\n\r\nconst LUNAR_MONTHS = [\r\n  'Wolf', 'Snow', 'Worm', 'Pink', 'Flower', 'Strawberry',\r\n  'Buck', 'Sturgeon', 'Harvest', \"Hunter's\", 'Beaver', 'Cold'\r\n];\r\n\r\nconst ZODIAC_SIGNS = [\r\n  'Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo',\r\n  'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'\r\n];\r\n\r\nfunction toJulianDate(date       = new Date())         {\r\n  return date.getTime() / 86400000 + 2440587.5;\r\n}\r\n\r\nfunction getMoonElongation(date       = new Date())         {\r\n  const jd = toJulianDate(date);\r\n  const T = (jd - 2451545.0) / 36525;\r\n\r\n  const M_sun = (357.52911 + 35999.05029 * T) * (Math.PI / 180);\r\n  const L_sun = (280.46646 + 36000.76983 * T + 1.914602 * Math.sin(M_sun) + 0.019993 * Math.sin(2 * M_sun)) % 360;\r\n\r\n  const L_moon = (218.3165 + 481267.8813 * T) % 360;\r\n  const M_moon = (134.9634 + 477198.8675 * T) * (Math.PI / 180);\r\n  const D = (297.8501921 + 445267.1114034 * T) % 360;\r\n\r\n  const periodicTerms =\r\n    6.289 * Math.sin(M_moon) -\r\n    1.274 * Math.sin(2 * (D * Math.PI / 180) - M_moon) +\r\n    0.658 * Math.sin(2 * (D * Math.PI / 180)) -\r\n    0.214 * Math.sin(2 * M_moon) -\r\n    0.186 * Math.sin(M_sun);\r\n\r\n  const trueMoonLong = (L_moon + periodicTerms + 360) % 360;\r\n  const trueSunLong = (L_sun + 360) % 360;\r\n\r\n  return ((trueMoonLong - trueSunLong + 360) % 360);\r\n}\r\n\r\nfunction getMoonAge(date       = new Date())         {\r\n  const elongation = getMoonElongation(date);\r\n  const age = (elongation / 360) * SYNODIC;\r\n  return age >= SYNODIC - 0.1 ? 0 : age;\r\n}\r\n\r\nfunction getIllumination(date       = new Date())         {\r\n  const elongation = getMoonElongation(date);\r\n  const illumination = (1 - Math.cos((elongation * Math.PI) / 180)) / 2;\r\n  return Math.round(illumination * 100);\r\n}\r\n\r\nfunction getPhaseId(age        )          {\r\n  if (age >= SYNODIC - HALF_THRESHOLD || age \u003c HALF_THRESHOLD) {\r\n    return 'new';\r\n  }\r\n  for (const p of LUNAR_PHASE_DEFS) {\r\n    if (p.id !== 'new' && age >= p.start && age \u003c p.end) {\r\n      return p.id;\r\n    }\r\n  }\r\n  return 'new';\r\n}\r\n\r\nfunction getLunarMonthName(date       = new Date())         {\r\n  const age = getMoonAge(date);\r\n  let daysToFull        ;\r\n  if (age >= SYNODIC - HALF_THRESHOLD) {\r\n    daysToFull = (SYNODIC - age) + FULL_MOON_PEAK;\r\n  } else {\r\n    daysToFull = FULL_MOON_PEAK - age;\r\n  }\r\n  const fullMoonDate = new Date(date.getTime() + daysToFull * 86400000);\r\n  return LUNAR_MONTHS[fullMoonDate.getMonth()];\r\n}\r\n\r\nfunction getMoonZodiac(date       = new Date())                                   {\r\n  const jd = toJulianDate(date);\r\n  const normalize = (v        ) => v - Math.floor(v);\r\n\r\n  const rp = normalize((jd - 2451555.8) / 27.321582241);\r\n  const ip = normalize((jd - 2451550.1) / 29.530588853);\r\n  const dp = 2 * Math.PI * normalize((jd - 2451562.2) / 27.55454988);\r\n  const radIp = 2 * Math.PI * ip;\r\n\r\n  const longitude = 360 * rp + 6.3 * Math.sin(dp) + 1.3 * Math.sin(2 * radIp - dp) + 0.7 * Math.sin(2 * radIp);\r\n  const finalLongitude = ((longitude % 360) + 360) % 360;\r\n\r\n  const index = Math.floor(finalLongitude / 30) % 12;\r\n  const degree = Math.floor(finalLongitude % 30);\r\n  return { sign: ZODIAC_SIGNS[index], degree };\r\n}\r\n\r\n                                  \r\n              \r\n                       \r\n                   \r\n                    \r\n                     \r\n                                           \r\n                     \r\n                     \r\n                        \r\n                        \r\n                         \r\n                       \r\n                  \r\n                                                            \r\n                         \r\n                      \r\n                     \r\n                    \r\n                   \r\n                   \r\n                 \r\n                  \r\n                    \r\n                        \r\n                  \r\n \r\n\r\nfunction getLiveLunarData(date       = new Date())                  {\r\n  const age = getMoonAge(date);\r\n  const phaseId = getPhaseId(age);\r\n  const illumination = getIllumination(date);\r\n  const lunarMonth = getLunarMonthName(date);\r\n  const zodiac = getMoonZodiac(date);\r\n\r\n  const isPreConjunction = age >= SYNODIC - HALF_THRESHOLD;\r\n  const cycleStart = isPreConjunction\r\n    ? new Date(date.getTime() + (SYNODIC - age) * 86400000)\r\n    : new Date(date.getTime() - age * 86400000);\r\n  const cycleEnd = new Date(cycleStart.getTime() + SYNODIC * 86400000);\r\n  const dayOfCycle = isPreConjunction ? 1 : Math.floor(age) + 1;\r\n\r\n  const phaseDef = LUNAR_PHASE_DEFS.find(p => p.id === phaseId) || LUNAR_PHASE_DEFS[0];\r\n  const isNewMoonWindow = isPreConjunction || age \u003c HALF_THRESHOLD;\r\n  const phaseDuration = isNewMoonWindow ? PHASE_DURATION.threshold : (phaseDef.end - phaseDef.start);\r\n  const dayInPhase = isNewMoonWindow\r\n    ? (age >= SYNODIC - HALF_THRESHOLD ? age - (SYNODIC - HALF_THRESHOLD) : age + HALF_THRESHOLD)\r\n    : (age - phaseDef.start);\r\n  const phaseRemaining = Math.max(0, phaseDuration - dayInPhase);\r\n  const phaseProgress = Math.min(1, Math.max(0, dayInPhase / phaseDuration));\r\n\r\n  const isThreshold = phaseId === 'new' || phaseId === 'first-quarter' || phaseId === 'full' || phaseId === 'last-quarter';\r\n  const isFlow = !isThreshold;\r\n  const tideKey                                                   =\r\n    phaseProgress \u003c 0.2 ? 'opening' : phaseProgress \u003c 0.62 ? 'flowing' : phaseProgress \u003c 0.88 ? 'completing' : 'closing';\r\n  const isApproaching = phaseRemaining \u003c= 1.0;\r\n  const isImminent = phaseRemaining \u003c= 0.25;\r\n\r\n  let daysToFull        ;\r\n  if (age >= SYNODIC t(id):undefined;}catch{}return {name,id:decoded,query:new URLSearchParams(query||'')};\r\n}\r\nconst initialState=()        =>{\r\n  let phase        ='first-quarter';let cycleId='cycle-10';\r\n  try{const live=getLiveLunarData();phase=live.phaseId;cycleId=live.cycleId;}catch{}\r\n  return {route:parseRoute(globalThis.location?.hash||''),echoKind:'all',search:'',loopFilter:'unfolding',phase,cycleId,time:'night',scenario:'ready',chat:[],chatContext:[],chatBusy:false,forceMicDenied:false,deepSheetOpen:false,deepSheetTab:'phase'};\r\n};\r\n\n\n// visuals.ts\n\r\nconst escapeHtml=(value        )=>String(value??'').replace(/[&\u003c>\"']/g,c=>({ '&':'&amp;', '\u003c':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }                         )[c]);\r\nfunction icon(name       ,size=20){\r\n  const paths                      ={\r\n    field:'\u003ccircle cx=\"12\" cy=\"12\" r=\"8\"/>\u003cpath d=\"M5 16c4-5 10-5 14-1M8 5c5 3 7 7 6 14\"/>',\r\n    echo:'\u003cpath d=\"M2 12c2 0 2-6 4-6s2 12 4 12 2-15 4-15 2 18 4 18 2-9 4-9\"/>',\r\n    cycle:'\u003ccircle cx=\"12\" cy=\"12\" r=\"8\"/>\u003cpath d=\"M12 4a8 8 0 0 0 0 16\" fill=\"currentColor\" opacity=\".4\"/>',\r\n    loop:'\u003cpath d=\"M8 16a5 5 0 1 1 7-7l-6 6a5 5 0 1 0 7-7\"/>',\r\n    thread:'\u003ccircle cx=\"5\" cy=\"5\" r=\"2\"/>\u003ccircle cx=\"19\" cy=\"12\" r=\"2\"/>\u003ccircle cx=\"5\" cy=\"19\" r=\"2\"/>\u003cpath d=\"M5 7v10m2-12c6 0 10 2 10 5M7 19c6 0 10-2 10-5\"/>',\r\n    reflect:'\u003cpath d=\"m12 3 8 9-8 9-8-9 8-9Zm0 0v18\"/>',\r\n    chat:'\u003cpath d=\"M20 11a8 8 0 0 1-8 8H4l1-5a8 8 0 1 1 15-3Z\"/>\u003cpath d=\"M8 10h8m-8 4h5\"/>',\r\n    mic:'\u003crect x=\"9\" y=\"3\" width=\"6\" height=\"12\" rx=\"3\"/>\u003cpath d=\"M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8\"/>',\r\n    write:'\u003cpath d=\"m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-4-4L5 15l-1 5Z\"/>',\r\n    arrow:'\u003cpath d=\"M4 12h16m-6-6 6 6-6 6\"/>',\r\n    back:'\u003cpath d=\"M20 12H4m6-6-6 6 6 6\"/>',\r\n    down:'\u003cpath d=\"m6 9 6 6 6-6\"/>',\r\n    close:'\u003cpath d=\"m6 6 12 12M6 18 18 6\"/>',\r\n    play:'\u003cpath d=\"m9 5 11 7-11 7V5Z\" fill=\"currentColor\" stroke=\"none\"/>',\r\n    pause:'\u003cpath d=\"M9 5v14m6-14v14\" stroke-width=\"3\"/>',\r\n    stop:'\u003crect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\" fill=\"currentColor\" stroke=\"none\"/>',\r\n    sun:'\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1\"/>',\r\n    moon:'\u003cpath d=\"M19 15a8 8 0 0 1-10-11 8 8 0 1 0 10 11Z\"/>',\r\n    search:'\u003ccircle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/>\u003cpath d=\"m16 16 5 5\"/>',\r\n    plus:'\u003cpath d=\"M12 5v14M5 12h14\"/>',\r\n    check:'\u003cpath d=\"m5 12 4 4L19 6\"/>',\r\n    menu:'\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>',\r\n    info:'\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 11v6m0-10v1\"/>',\r\n    return:'\u003cpath d=\"m4 10 4-4m-4 4 4 4m-4-4h10a6 6 0 1 1 0 12\"/>',\r\n    send:'\u003cpath d=\"M12 20V4m-6 6 6-6 6 6\"/>',\r\n    volume:'\u003cpath d=\"m11 5-6 4H2v6h3l6 4V5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14\"/>',\r\n    offline:'\u003cpath d=\"m3 3 18 18M8 8a8 8 0 0 0-5 3m8-6a16 16 0 0 1 10 5M7 15a7 7 0 0 1 8-1m-4 5h2\"/>',\r\n    settings:'\u003cpath d=\"M4 7h16M4 17h16\"/>\u003ccircle cx=\"9\" cy=\"7\" r=\"3\" fill=\"var(--surface)\"/>\u003ccircle cx=\"15\" cy=\"17\" r=\"3\" fill=\"var(--surface)\"/>',\r\n  };\r\n  return `\u003csvg width=\"${size}\" height=\"${size}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${paths[name]||paths.field}\u003c/svg>`;\r\n}\r\nfunction moonDisc(index       ,size=32){\r\n  const left='M16 2A14 14 0 0 0 16 30Z',right='M16 2A14 14 0 0 1 16 30Z';\r\n  let lit='';\r\n  if(index===1)lit='\u003cpath d=\"M16 2A14 14 0 0 1 16 30C28 23 28 9 16 2Z\"/>';\r\n  if(index===2)lit=`\u003cpath d=\"${right}\"/>`;\r\n  if(index===3)lit='\u00
